<!-- 
** Task 2-2: Integration with Task 1 **
1. Stereo frame (top and bottom)
- put the stereo video frame into a texture
- locate to the back so that we cannot see it
2.Split into L/R (locate two videos to left and right)
- use a shader to split the stereo video into left and right images
3. Task 1: Processing
4. Task 2: Anaglyph
5. Display
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>Task 2-2: Integration with Task 1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #aaaaaa;
      font-family: Monospace;
    }
  </style>
</head>

<body>
  <!-- Load Three.js using import maps -->
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import WEBGL from "three/addons/capabilities/WebGL.js";
    
    // Import our shared image processing module
    import { 
      TextureProcessor, 
      vertexShader, 
      MixFragmentShader
    } from "./Anaglyph-ImgProcessing.js";

    // --- Main Application Variables ---
    let camera, controls, scene, renderer;
    let video, videoTexture;
    let textureProcessor, processingMaterial, anaglyphMaterial;

    // Initialize and start the application
    init();
    animate();

    function init() {
      // 1. Check for WebGL 2 support
      if (WEBGL.isWebGL2Available() === false) {
        document.body.appendChild(WEBGL.getWebGL2ErrorMessage());
        return;
      }

      // 2. Setup Renderer
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("webgl2");
      document.body.appendChild(canvas);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, context: context });
      renderer.autoClear = false;
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);

      // 3. Setup Main Scene and Camera
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.001, 10);
      camera.position.z = 1.0;

      // 4. Setup Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.minDistance = 0.005;
      controls.maxDistance = 2.0;
      controls.enableRotate = true;

      // 5. Setup Video Element
      video = document.createElement("video");
      video.src = "video_1080p_30fps_stereo.mp4";
      video.load();
      video.muted = true; // Video must be muted to autoplay in many browsers
      video.loop = true;

      // Wait for video data to load before creating textures and materials
      video.onloadeddata = () => {
        // Create a texture that updates with the video playback
        videoTexture = new THREE.VideoTexture(video);
        videoTexture.minFilter = THREE.NearestFilter;
        videoTexture.magFilter = THREE.NearestFilter;
        videoTexture.generateMipmaps = false;
        videoTexture.format = THREE.RGBAFormat;

        const halfHeight = Math.floor(video.videoHeight / 2);

        // Create our custom shader material for stereo processing
        processingMaterial = new THREE.RawShaderMaterial({
          uniforms: {
            imageTexture: { value: videoTexture },
            halfHeight: { value: halfHeight },
            // for video processing parts
            videoProcessMode: { value: 0 }, // 0: none, 1: box, 2: gaussian, 3: laplacian, 4: separable, 5: median
              // box fragmentShader
              blurRadius: { value: 5 },
              // gaussian and separatable fragmentShader
              radius : { value: 3 },
              sigma : { value: 1.0 },
              // laplacian fragmentShader
              displayMode: { value: false },
              // separable fragmentShader
              horizontal: { value: true },
              // for all fragmentShaders
              colorScaleR: { value: 1.0 },
              colorScaleG: { value: 1.0 },
              colorScaleB: { value: 1.0 },
              invertColors: { value: false },
              imageTexture: { value: videoTexture },

              // anaglyph mode
              anaglyphMode: { value: 0 }, // 0: true, 1: gray, 2: color, 3: half-color, 4: optimized
          },
          vertexShader: vertexShader,
          fragmentShader: MixFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        anaglyphMaterial = new THREE.RawShaderMaterial({
          uniforms: {
            imageTexture: { value: videoTexture },
            halfHeight: { value: halfHeight },
            anaglyphMode: { value: 0 }, // 0: true, 1: gray, 2: color, 3: half-color, 4: optimized
          },
          vertexShader: vertexShader,
          fragmentShader: MixFragmentShader,
          glslVersion: THREE.GLSL3,
        });

        // Initialize our off-screen processor. Output size is videoWidth x halfHeight
        textureProcessor = new TextureProcessor(
          video.videoWidth,
          halfHeight,
          processingMaterial
        );

        // Aspect ratios
        const processedAspectRatio = halfHeight / video.videoWidth;
        const originalAspectRatio = video.videoHeight / video.videoWidth;

        // Create the First Plane (showing processed averaged video)
        const processedGeometry = new THREE.PlaneGeometry(1, processedAspectRatio);
        const processedMaterial = new THREE.MeshBasicMaterial({
          map: textureProcessor.renderTarget.texture, // Use processed texture
          side: THREE.DoubleSide,
        });
        const processedPlane = new THREE.Mesh(processedGeometry, processedMaterial);
        processedPlane.position.z = 0.15; // Move slightly forward
        scene.add(processedPlane);

        // Create the Second Plane (showing original stereo video)
        const originalGeometry = new THREE.PlaneGeometry(1, originalAspectRatio);
        const originalMaterial = new THREE.MeshBasicMaterial({
          map: videoTexture, // Use raw video texture
          side: THREE.DoubleSide,
        });
        const originalPlane = new THREE.Mesh(originalGeometry, originalMaterial);
        originalPlane.position.z = -0.15; // Move slightly backward
        scene.add(originalPlane);

        // Setup GUI interactions
        setupGUI();

        // Start video playback
        video.play();
      };

      // Handle window resizing
      window.addEventListener("resize", onWindowResize);
    }

    function setupGUI() {
      const gui = new GUI();
      
      // Video playback controls
      const videoControls = {
        togglePlayPause: () => {
          if (video.paused) video.play();
          else video.pause();
        },
        skipForward: () => {
          video.currentTime += 10;
        },
      };
      gui.add(videoControls, "togglePlayPause").name("Play / Pause");
      gui.add(videoControls, "skipForward").name("Skip +10s");

      const params = {
        method: "None",
      };

      const imgProcessing = {
        "None": 0, 
        "Box": 1, 
        "Gaussian": 2,
        "Laplacian": 3, 
        "Separable": 4,
        "Median": 5
      };

      gui.add(params, "method", imgProcessing).name("Video Processing Mode").onChange((value) => {
          processingMaterial.uniforms.videoProcessMode.value = value; 
          const selectedKey = Object.keys(imgProcessing).find(key => imgProcessing[key] === value);
          updateMethodGUI(selectedKey);
      });

      gui.add(processingMaterial.uniforms.anaglyphMode, "value", {
        "True Anaglyph": 0, 
        "Gray Anaglyph": 1, 
        "Color Anaglyph": 2,
        "Half-Color Anaglyph": 3, 
        "Optimized Anaglyph": 4 
      }).name("Anaglyph Mode"); 

      // Filter parameters (collapsed folder)
      // show the parapeters depends on the @rpcessingMaterial.uniforms.videoProcessMode.value
      let methodFolder = gui.addFolder("Image Processing Parameters");
      function updateMethodGUI(method) {
        methodFolder.destroy();
        methodFolder = gui.addFolder("Image Processing Parameters");

        const uniforms = processingMaterial.uniforms;

        switch (method) {
            case "None":
                break;

            case "Box":
                methodFolder.add(uniforms.blurRadius, "value", 1, 20, 1).name("Blur Radius");
                break;

            case "Gaussian":
                methodFolder.add(uniforms.radius, "value", 1, 50, 1).name("Kernel Size");
                methodFolder.add(uniforms.sigma, "value", 0.1, 100.0).name("Sigma (σ)");
                break;

            case "Laplacian":
                methodFolder.add(uniforms.displayMode, "value").name("Normalization");
                break;

            case "Separable":
                methodFolder.add(uniforms.radius, "value", 1, 50, 1).name("Kernel Size");
                methodFolder.add(uniforms.sigma, "value", 0.1, 100.0).name("Sigma (σ)");
                methodFolder.add(uniforms.horizontal, "value").name("Horizontal Pass");
                break;

            case "Median":
                break;
        }
      }

      // Color controls (collapsed folder)
      const colorFolder = gui.addFolder("Color Control Parameters");
      colorFolder.add(processingMaterial.uniforms.colorScaleR, "value", 0, 2, 0.01).name("Scale R");
      colorFolder.add(processingMaterial.uniforms.colorScaleG, "value", 0, 2, 0.01).name("Scale G");
      colorFolder.add(processingMaterial.uniforms.colorScaleB, "value", 0, 2, 0.01).name("Scale B");
      colorFolder.add(processingMaterial.uniforms.invertColors,"value").name("Invert Colors");
      colorFolder.close();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      
      // 1. Clear the screen
      renderer.clear();

      // 2. Process the current video frame (if ready)
      if (textureProcessor) {
        textureProcessor.process(renderer);
      }

      // 3. Render the main 3D scene (containing our two planes)
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
